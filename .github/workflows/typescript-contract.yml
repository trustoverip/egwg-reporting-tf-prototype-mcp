name: TypeScript contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: toip-mcp-server/package-lock.json
      - working-directory: toip-mcp-server
        run: npm ci
      - working-directory: toip-mcp-server
        run: npm run build
      - working-directory: toip-mcp-server
        run: npm test
